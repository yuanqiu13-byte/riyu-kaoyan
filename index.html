<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日语考研 · 院校专业查询（2027）</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#1c2230;--muted:#596173;--line:#dfe3ec;--accent:#b8322a;--accent-soft:#fbecea;--focus:#1a5fd0;--mark:#ffe08a}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
body:has(dialog[open]){overflow:hidden}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.skip{position:absolute;left:-9999px;top:0;background:#fff;color:var(--ink);padding:8px 12px;z-index:10;border-radius:8px}
.skip:focus{left:12px;top:12px}
header.top{background:linear-gradient(135deg,#1f2a44,#2f3d63);color:#fff;padding:28px 0 72px}
header.top h1{margin:0;font-size:26px;letter-spacing:.5px}
header.top h1 .dot{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:#e2483d;margin-right:.4em;vertical-align:.05em}
header.top p{margin:6px 0 0;color:#d5dbea;font-size:14px}
.panel{background:var(--card);border-radius:14px;box-shadow:0 6px 24px rgba(20,30,60,.08);padding:18px;margin-top:-52px;position:relative}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--muted)}
.grow{flex:1 1 300px}
select,input[type=search]{font:inherit;height:44px;border:1px solid #b9c0ce;border-radius:10px;padding:0 12px;background:#fff;color:var(--ink)}
input[type=search]{width:100%}
button{font:inherit;cursor:pointer}
.btn{height:44px;padding:0 16px;border-radius:10px;border:1px solid #b9c0ce;background:#fff;color:var(--ink)}
.btn:hover{background:#f1f3f8}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.hints{margin-top:12px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:#f7f8fb;border-radius:999px;padding:3px 10px;font-size:13px;color:var(--ink)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.summary{margin:18px 0 6px;font-size:15px}
.summary strong{color:var(--accent)}
.regions{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 20px;padding:0;list-style:none}
.rbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;color:var(--ink)}
.rbtn .n{color:var(--muted);font-size:12px;margin-left:4px}
.rbtn:hover:not(:disabled){border-color:var(--accent)}
.rbtn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.rbtn[aria-pressed=true] .n{color:#fde3e0}
.rbtn:disabled{opacity:.45;cursor:not-allowed}
.region{margin-bottom:28px}
.region h2{font-size:19px;margin:0 0 12px;display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;border-left:4px solid var(--accent);padding-left:10px}
.region h2 small{font-size:13px;color:var(--muted);font-weight:normal}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.school{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.school:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(184,50,42,.12)}
@media (prefers-reduced-motion:reduce){.school{transition:none}}
.school .nm{font-weight:600;font-size:16px}
.school .cd{font-size:12px;color:var(--muted)}
.school .st{font-size:13px;color:var(--accent)}
.school .pv{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.empty{background:#fff;border:1px dashed #b9c0ce;border-radius:12px;padding:32px;text-align:center;color:var(--muted)}
footer{color:var(--muted);font-size:13px;padding:16px 20px 40px;text-align:center}
dialog{width:min(1000px,94vw);max-height:90vh;padding:0;border:none;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:auto;color:var(--ink)}
dialog::backdrop{background:rgba(15,20,35,.55)}
.dhead{position:sticky;top:0;background:#fff;padding:18px 20px 12px;border-bottom:1px solid var(--line);z-index:1}
.dhead h2{margin:0;font-size:21px;padding-right:52px}
.dmeta{margin:4px 0 0;color:var(--muted);font-size:14px}
.close{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:22px;line-height:1;color:var(--ink)}
.close:hover{background:#f1f3f8}
.dtools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:10px;font-size:14px}
.dtools input{width:18px;height:18px;vertical-align:-3px;margin:0 6px 0 0}
.dtools .cnt{color:var(--muted)}
.dbody{padding:16px 20px 24px}
.grp{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.grp h3{margin:0 0 6px;font-size:16px}
.grp h3 .cd{color:var(--accent);margin-right:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;font-size:13px}
.tag{background:#f1f3f8;border-radius:6px;padding:2px 8px;color:#3a4255}
.tag.ft{background:var(--accent-soft);color:#8f241d}
.twrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:720px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{background:#f7f8fb;color:#3a4255;font-weight:600;white-space:nowrap}
tbody tr:hover{background:#fafbfd}
@media (max-width:640px){header.top h1{font-size:21px}.panel{padding:14px}.dhead{padding:14px}.dbody{padding:12px}}
</style>
</head>

<header class="top"><div class="wrap">

<main class="wrap">

          <option value="c1">业务课一</option>

    </div>
    <div class="hints"><span>试试：</span>
      <button type="button" class="chip" data-f="major" data-q="外国语言学">专业：外国语言学</button>
      <button type="button" class="chip" data-f="major" data-q="050211">专业代码：050211</button>
      <button type="button" class="chip" data-f="dir" data-q="日语">研究方向：日语</button>
      <button type="button" class="chip" data-f="c1" data-q="数学二">业务课一：数学二</button>
      <button type="button" class="chip" data-f="c2" data-q="翻译">业务课二：翻译</button>
    </div>
  </form>
  <p class="summary" id="summary" aria-live="polite"></p>
  <nav aria-label="按地区筛选"><ul class="regions" id="regions"></ul></nav>
  <div id="results" tabindex="-1"></div>
</main>
<footer>数据整理自《研招网 · 2027 院校库》表格，仅供参考。报考请以研招网及各招生单位官方发布的招生目录为准。</footer>

<dialog id="dlg" aria-labelledby="dTitle">
  <div class="dhead">
    <h2 id="dTitle"></h2>
    <p class="dmeta" id="dMeta"></p>
    <button type="button" class="close" id="dClose" aria-label="关闭详情">×</button>
    <div class="dtools" id="dTools">
      <label><input type="checkbox" id="onlyMatch" checked>只显示符合当前查询条件的专业</label>
      <span class="cnt" id="dCount"></span>
    </div>
  </div>
  <div class="dbody" id="dBody"></div>
</dialog>

  const FIELDS = { all: [3, 5, 8, 9], major: [3], dir: [5], c1: [8], c2: [9] };

  // 全角转半角、去括号和空白，让“数学二”“数学(二)”“302”都能命中“(302)数学（二）”
  const toHalf = s => s.replace(/[\uFF01-\uFF5E]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/\u3000/g, ' ');
  const norm = s => toHalf(s).toLowerCase().replace(/[()\s]/g, '');
  const NS = S.map(norm);
  const split = s => { const m = /^\(([^)]*)\)([\s\S]*)$/.exec(s); return m ? { code: m[1], name: m[2] } : { code: '', name: s }; };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const $ = id => document.getElementById(id);

  // ---- 建立索引 ----
  const recs = [];
  for (let i = 0; i < F.length; i += NC) recs.push(F.slice(i, i + NC));
  const schools = new Map();
  for (const r of recs) {
    let s = schools.get(r[0]);
    if (!s) {
      const p = split(S[r[0]]), g = split(S[r[1]]);
      s = { key: r[0], code: p.code, name: p.name, rKey: r[1], rCode: g.code, region: g.name, recs: [] };
      schools.set(r[0], s);
    }
    s.recs.push(r);
  }
  const regionMap = new Map();
  for (const s of schools.values()) if (!regionMap.has(s.rKey)) regionMap.set(s.rKey, { key: s.rKey, code: s.rCode, name: s.region });
  const regions = [...regionMap.values()].sort((a, b) => a.code.localeCompare(b.code));
  const schoolList = [...schools.values()].sort((a, b) => a.code.localeCompare(b.code));

  const qEl = $('q'), fieldEl = $('field'), modeEl = $('mode'), examEl = $('exam'), dlg = $('dlg');
  const uniqVals = col => [...new Set(recs.map(r => S[r[col]]))].sort();
  uniqVals(4).forEach(v => modeEl.add(new Option(v, v)));
  uniqVals(10).forEach(v => examEl.add(new Option(v, v)));
  $('meta').textContent = `数据来源：研招网 2027 院校库 · ${schools.size} 所院校 · ${regions.length} 个地区 · ${recs.length} 条招生方向 · 外语科目均为 (203) 日语`;

  // ---- 查询状态 ----
  let regionSel = null, pred = () => true, hlRe = null, hlCols = new Set(), filtered = false, cur = null;

  function buildQuery() {
    const terms = toHalf(qEl.value).split(/[\s,;、]+/).map(norm).filter(Boolean);
    const cols = FIELDS[fieldEl.value] || FIELDS.all;
    const modeIdx = modeEl.value ? S.indexOf(modeEl.value) : -1;
    const examIdx = examEl.value ? S.indexOf(examEl.value) : -1;
    filtered = terms.length > 0 || modeIdx >= 0 || examIdx >= 0;
    pred = r => (modeIdx < 0 || r[4] === modeIdx) && (examIdx < 0 || r[10] === examIdx) &&
      terms.every(t => cols.some(c => NS[r[c]].includes(t)));
    hlCols = new Set(terms.length ? cols : []);
    hlRe = terms.length
      ? new RegExp([...terms].sort((a, b) => b.length - a.length).map(t => [...t].map(escRe).join('[()（）\\s]*')).join('|'), 'gi')
      : null;
  }

  function hl(text, col) {
    if (!hlRe || !hlCols.has(col)) return esc(text);
    let out = '', last = 0;
    for (const m of text.matchAll(hlRe)) {
      out += esc(text.slice(last, m.index)) + '<mark>' + esc(m[0]) + '</mark>';
      last = m.index + m[0].length;
    }
    return out + esc(text.slice(last));
  }

  function syncHash() {
    const p = new URLSearchParams();
    if (qEl.value.trim()) p.set('q', qEl.value.trim());
    if (fieldEl.value !== 'all') p.set('f', fieldEl.value);
    if (modeEl.value) p.set('m', modeEl.value);
    if (examEl.value) p.set('e', examEl.value);
    if (regionSel !== null) p.set('r', regionMap.get(regionSel).name);
    const h = p.toString();
    try { history.replaceState(null, '', h ? '#' + h : location.pathname + location.search); } catch (e) { /* 部分浏览器的 file:// 环境不允许 */ }
  }

  function run() {
    buildQuery();
    const bySchool = new Map();
    let total = 0;
    for (const r of recs) {
      if (!pred(r)) continue;
      total++;
      let a = bySchool.get(r[0]);
      if (!a) bySchool.set(r[0], a = []);
      a.push(r);
    }
    const regCount = new Map();
    for (const [k, a] of bySchool) {
      const s = schools.get(k);
      const c = regCount.get(s.rKey) || { schools: 0, n: 0 };
      c.schools++; c.n += a.length;
      regCount.set(s.rKey, c);
    }
    if (regionSel !== null && !regCount.has(regionSel)) regionSel = null;

    // 地区按钮
    $('regions').innerHTML =
      `<li><button type="button" class="rbtn" data-r="" aria-pressed="${regionSel === null}">全部地区<span class="n">${bySchool.size}</span></button></li>` +
      regions.map(g => {
        const c = regCount.get(g.key);
        return `<li><button type="button" class="rbtn" data-r="${g.key}" aria-pressed="${regionSel === g.key}"${c ? '' : ' disabled'}>${esc(g.name)}<span class="n">${c ? c.schools : 0}</span></button></li>`;
      }).join('');

    // 摘要
    const where = regionSel !== null ? `，当前只看 <strong>${esc(regionMap.get(regionSel).name)}</strong>` : '';
    $('summary').innerHTML = filtered
      ? `找到 <strong>${bySchool.size}</strong> 所院校、<strong>${total}</strong> 条招生方向，分布在 ${regCount.size} 个地区${where}。点击院校查看专业详情。`
      : `共 ${schools.size} 所院校可用日语报考${where}。输入关键词查询，或按地区浏览，点击院校查看专业详情。`;

    // 结果（按地区分组）
    const list = regions.filter(g => regCount.has(g.key) && (regionSel === null || regionSel === g.key));
    $('results').innerHTML = list.length ? list.map(g => {
      const c = regCount.get(g.key);
      const ss = schoolList.filter(s => s.rKey === g.key && bySchool.has(s.key));
      return `<section class="region" aria-labelledby="rg-${g.key}"><h2 id="rg-${g.key}">${esc(g.name)}<small>${c.schools} 所院校 · ${c.n} 条招生方向</small></h2>` +
        `<div class="grid">${ss.map(s => card(s, bySchool.get(s.key))).join('')}</div></section>`;
    }).join('') : `<div class="empty">没有找到匹配的院校。可以换个关键词、减少关键词，或把“查询范围”改成“综合”。</div>`;
    syncHash();
  }

  function card(s, a) {
    const majors = [...new Set(a.map(r => r[3]))];
    const shown = majors.slice(0, 4).map(k => hl(split(S[k]).name, 3)).join('、');
    const more = majors.length > 4 ? ` 等` : '';
    return `<button type="button" class="school" data-k="${s.key}" aria-haspopup="dialog">` +
      `<span class="nm">${esc(s.name)}</span><span class="cd">院校代码 ${esc(s.code)}</span>` +
      `<span class="st">${majors.length} 个专业 · ${a.length} 条招生方向</span><span class="pv">${shown}${more}</span></button>`;
  }

  // ---- 院校详情 ----
  function openSchool(k) {
    cur = schools.get(k);
    $('onlyMatch').checked = true;
    renderDialog();
    dlg.showModal();
    dlg.scrollTop = 0;
  }

  function renderDialog() {
    const s = cur;
    const only = filtered && $('onlyMatch').checked;
    const list = only ? s.recs.filter(pred) : s.recs;
    $('dTools').hidden = !filtered;
    $('dTitle').textContent = s.name;
    $('dMeta').textContent = `院校代码 ${s.code} · 所在地 ${s.region} · 可用日语报考 ${new Set(s.recs.map(r => r[3])).size} 个专业、${s.recs.length} 条招生方向`;
    $('dCount').textContent = only ? `当前显示 ${new Set(list.map(r => r[3])).size} 个专业、${list.length} 条方向` : '';

    // 按 院系所 + 专业 + 学习方式 分组
    const groups = new Map();
    for (const r of list) {
      const key = r[2] + '|' + r[3] + '|' + r[4];
      let g = groups.get(key);
      if (!g) groups.set(key, g = []);
      g.push(r);
    }
    const cmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
    const gs = [...groups.values()].sort((a, b) =>
      cmp(S[a[0][3]], S[b[0][3]]) || cmp(S[a[0][2]], S[b[0][2]]) || cmp(S[a[0][4]], S[b[0][4]]));

    $('dBody').innerHTML = gs.map((g, i) => {
      const r0 = g[0], m = split(S[r0[3]]), mode = S[r0[4]];
      return `<article class="grp" aria-labelledby="g${i}">` +
        `<h3 id="g${i}"><span class="cd">${hl(m.code, 3)}</span>${hl(m.name, 3)}</h3>` +
        `<p class="tags"><span class="tag">院系所：${esc(S[r0[2]])}</span><span class="tag${mode === '全日制' ? ' ft' : ''}">${esc(mode)}</span><span class="tag">${g.length} 个研究方向</span></p>` +
        `<div class="twrap" role="region" tabindex="0" aria-label="${esc(m.name)}（${esc(mode)}）研究方向与考试科目"><table>` +
        `<thead><tr><th scope="col">研究方向</th><th scope="col">政治</th><th scope="col">外语</th><th scope="col">业务课一</th><th scope="col">业务课二</th><th scope="col">考试方式</th></tr></thead><tbody>` +
        g.map(r => `<tr><td>${hl(S[r[5]], 5)}</td><td>${esc(S[r[6]])}</td><td>${esc(S[r[7]])}</td><td>${hl(S[r[8]], 8)}</td><td>${hl(S[r[9]], 9)}</td><td>${esc(S[r[10]])}</td></tr>`).join('') +
        `</tbody></table></div></article>`;
    }).join('') || `<div class="empty">该校没有符合当前条件的专业。</div>`;
  }

  // ---- 事件 ----
  let timer;
  qEl.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(run, 160); });
  [fieldEl, modeEl, examEl].forEach(el => el.addEventListener('change', run));
  $('form').addEventListener('submit', e => { e.preventDefault(); clearTimeout(timer); run(); });
  $('reset').addEventListener('click', () => {
    qEl.value = ''; fieldEl.value = 'all'; modeEl.value = ''; examEl.value = ''; regionSel = null;
    run(); qEl.focus();
  });
  document.querySelector('.hints').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    fieldEl.value = b.dataset.f; qEl.value = b.dataset.q; run();
  });
  $('regions').addEventListener('click', e => {
    const b = e.target.closest('.rbtn'); if (!b || b.disabled) return;
    regionSel = b.dataset.r === '' ? null : Number(b.dataset.r);
    run();
    const nb = $('regions').querySelector(`.rbtn[data-r="${b.dataset.r}"]`);
    if (nb) nb.focus();
  });
  $('results').addEventListener('click', e => {
    const b = e.target.closest('.school'); if (b) openSchool(Number(b.dataset.k));
  });
  $('onlyMatch').addEventListener('change', renderDialog);
  $('dClose').addEventListener('click', () => dlg.close());
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

  // 从地址栏恢复查询条件（便于收藏、分享）
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get('q')) qEl.value = p.get('q');
  if (p.get('f') && FIELDS[p.get('f')]) fieldEl.value = p.get('f');
  if (p.get('m')) modeEl.value = p.get('m');
  if (p.get('e')) examEl.value = p.get('e');
  if (p.get('r')) { const g = regions.find(x => x.name === p.get('r')); if (g) regionSel = g.key; }
  run();
  if (p.get('open')) { const s = schoolList.find(x => x.code === p.get('open') || x.name === p.get('open')); if (s) openSchool(s.key); }
})();
</script>
</body>
</html>
